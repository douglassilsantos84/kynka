services:
  kynka-api:
    build: .
    ports:
      - "${KYNKA_API_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/platform/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  kynka-postgres:
    image: postgres:17
    profiles:
      - postgres
    environment:
      POSTGRES_USER: kynka
      POSTGRES_PASSWORD: ${KYNKA_POSTGRES_PASSWORD:-}
      POSTGRES_DB: kynka
    ports:
      - "${KYNKA_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - kynka-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kynka -d kynka"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  kynka-postgres-data:
    name: kynka-postgres-data
